services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tablerauth-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-LocalDev_ChangeMe1}
    ports:
      - "1433:1433"
    volumes:
      - tablerauth-mssql-data:/var/opt/mssql

volumes:
  tablerauth-mssql-data:
